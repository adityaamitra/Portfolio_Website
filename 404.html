<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 | Aditya Mitra</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0a0a14" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100svh; display: flex; align-items: center; justify-content: center;
  background: #0a0a14; color: #a4a4bd;
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  padding: 1.5rem; overflow: hidden;
}
.orb {
  position: fixed; border-radius: 50%; filter: blur(90px); opacity: .45; z-index: -1;
}
.orb-v { width: 44vw; height: 44vw; background: rgba(139,92,246,.3); top: -12vw; left: -8vw; }
.orb-c { width: 30vw; height: 30vw; background: rgba(34,211,238,.18); bottom: -8vw; right: -6vw; }
.term {
  width: 100%; max-width: 560px;
  background: rgba(12,12,24,.92); border: 1px solid rgba(148,148,190,.3); border-radius: 16px;
  box-shadow: 0 0 50px rgba(139,92,246,.16), 0 30px 80px rgba(0,0,0,.6);
  overflow: hidden;
}
.bar { display: flex; align-items: center; gap: .45rem; padding: .7rem .95rem; border-bottom: 1px solid rgba(148,148,190,.14); }
.bar i { width: 10px; height: 10px; border-radius: 50%; }
.bar i:nth-child(1) { background: #f87171 } .bar i:nth-child(2) { background: #fbbf24 } .bar i:nth-child(3) { background: #34d399 }
.bar b { font-size: .68rem; font-weight: 400; color: #71718e; margin-left: .6rem; }
.body { padding: 1.4rem 1.5rem 1.6rem; font-size: .82rem; line-height: 2; }
.cmd { color: #ececf4; }
.cmd::before { content: '$ '; color: #22d3ee; }
.err { color: #f87171; }
.hint { color: #a78bfa; }
a.home {
  display: inline-block; margin-top: .8rem;
  color: #22d3ee; text-decoration: none; border: 1px solid rgba(34,211,238,.35); border-radius: 8px;
  padding: .45rem .9rem; font-size: .8rem;
  transition: box-shadow .25s ease, transform .25s ease;
}
a.home:hover { box-shadow: 0 0 22px rgba(34,211,238,.25); transform: translateY(-2px); }
.cursor::after { content: '▋'; color: #22d3ee; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { .cursor::after { animation: none; } }
</style>
</head>
<body>
<div class="orb orb-v"></div>
<div class="orb orb-c"></div>
<main class="term">
  <div class="bar"><i></i><i></i><i></i><b>aditya@portfolio: zsh</b></div>
  <div class="body">
    <div class="cmd">curl adityamitra.vercel.app<span id="path"></span></div>
    <div class="err">404: route not found</div>
    <div class="hint">hint: everything lives on one page anyway.</div>
    <a class="home" href="/">$ cd / · take me home</a>
    <div class="cursor"></div>
  </div>
</main>
<script>
document.getElementById('path').textContent = location.pathname;
</script>
</body>
</html>
